```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcademyPro - Badminton</title>
  
  <!-- Load Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Load Babel to translate React JSX on the fly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Custom Scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-900 text-slate-200">
  
  <div id="root"></div>

  <!-- Application Code -->
  <script type="text/babel" data-type="module">
    // Import React, Icons, and Firebase directly from web modules (No npm required!)
    import React, { useState, useEffect, useMemo, createContext, useContext } from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { 
      Users, CreditCard, LayoutDashboard, Settings, Plus, Search, Bell, 
      Menu, X, ChevronRight, MessageCircle, CheckCircle, AlertCircle, Clock, Calendar, Loader2 
    } from 'https://esm.sh/lucide-react';
    
    import { initializeApp } from 'https://esm.sh/firebase@10.8.0/app';
    import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://esm.sh/firebase@10.8.0/auth';
    import { getFirestore, doc, setDoc, updateDoc, onSnapshot, collection } from 'https://esm.sh/firebase@10.8.0/firestore';

    // ============================================================================
    // ⚠️ IMPORTANT: PASTE YOUR FIREBASE CONFIGURATION HERE ⚠️
    // If you do not add this, your data will NOT save when you refresh the page.
    // ============================================================================
    const firebaseConfig = {
      apiKey: "", // e.g. "AIzaSyB..."
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };

    let app, auth, db;
    // Only initialize if the user put in their API key
    if (firebaseConfig.apiKey) {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch(e) { console.error("Firebase init error", e); }
    }

    const appId = 'academy-pro-badminton'; 

    // --- Utility Functions ---
    const getCurrentMonthYear = () => {
      const d = new Date();
      return { month: d.getMonth() + 1, year: d.getFullYear() };
    };
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const defaultTemplate = "Hello {Player_Name}, this is a gentle reminder that your fee of ₹{Amount} for {Month} is currently {Status}. Please clear it at the earliest. - Academy Admin";

    // --- Context & State Management ---
    const AppContext = createContext();

    const AppProvider = ({ children }) => {
      const [user, setUser] = useState(null);
      const [isDataLoaded, setIsDataLoaded] = useState(false);
      
      const [players, setPlayers] = useState([]);
      const [payments, setPayments] = useState([]);
      const [sports] = useState(['Badminton']); // STRICTLY Badminton
      const [batches] = useState(['Morning (6-8 AM)', 'Evening (5-7 PM)', 'Weekend (9-12 AM)']);
      const [settings, setSettings] = useState({ whatsappTemplate: defaultTemplate, lastResetMonth: null });
      const [logs, setLogs] = useState([]);

      useEffect(() => {
        // If Firebase is not configured, load mock data/empty state immediately
        if (!auth || !db) {
          console.warn("Firebase not configured. App will run in memory only (data won't save).");
          setIsDataLoaded(true);
          return; 
        }

        const initAuth = async () => {
          try { await signInAnonymously(auth); } 
          catch (e) { console.error("Auth error", e); setIsDataLoaded(true); }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (u) => {
          setUser(u);
          if (!u) setIsDataLoaded(true);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!db || !user) return;

        const playersRef = collection(db, 'artifacts', appId, 'users', user.uid, 'players');
        const paymentsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'payments');
        const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'main');
        const logsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'logs');

        const unsubPlayers = onSnapshot(playersRef, (snap) => {
          setPlayers(snap.docs.map(d => ({ ...d.data(), id: d.id })));
        });

        const unsubPayments = onSnapshot(paymentsRef, (snap) => {
          setPayments(snap.docs.map(d => ({ ...d.data(), id: d.id })));
        });

        const unsubSettings = onSnapshot(settingsRef, (docSnap) => {
          if (docSnap.exists()) setSettings(docSnap.data());
        });

        const unsubLogs = onSnapshot(logsRef, (snap) => {
          const logsData = snap.docs.map(d => ({ ...d.data(), id: d.id }));
          setLogs(logsData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
          setIsDataLoaded(true); 
        });

        return () => { unsubPlayers(); unsubPayments(); unsubSettings(); unsubLogs(); };
      }, [user]);

      const addPlayer = async (player) => {
        const newPlayer = { ...player, id: Math.random().toString(36).substr(2, 9), joiningDate: new Date().toISOString(), status: 'ACTIVE' };
        
        if (!db || !user) {
          // Fallback if no database (temporary save until refresh)
          setPlayers([...players, newPlayer]);
          return;
        }

        try {
          const newPlayerRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'players'));
          newPlayer.id = newPlayerRef.id;
          await setDoc(newPlayerRef, newPlayer);
          
          const current = getCurrentMonthYear();
          const newPaymentRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'payments'));
          await setDoc(newPaymentRef, {
            id: newPaymentRef.id, playerId: newPlayer.id, month: current.month, year: current.year, 
            expectedAmount: newPlayer.feeAmount, paidAmount: 0, status: 'UNPAID', mode: '', notes: '', date: null
          });

          await logAction('PLAYER_ADDED', `New admission: ${newPlayer.name}`);
        } catch (e) { console.error("Error adding player", e); }
      };

      const markPayment = async (paymentId, mode, amount, notes) => {
        const p = payments.find(p => p.id === paymentId);
        if(!p) return;
        
        const newPaidAmount = p.paidAmount + Number(amount);
        const newStatus = newPaidAmount >= p.expectedAmount ? 'PAID' : 'PARTIAL';
        
        if (!db || !user) {
          // Fallback
          setPayments(payments.map(pay => pay.id === paymentId ? { ...pay, paidAmount: newPaidAmount, status: newStatus } : pay));
          return;
        }

        try {
          const pRef = doc(db, 'artifacts', appId, 'users', user.uid, 'payments', paymentId);
          await updateDoc(pRef, { paidAmount: newPaidAmount, status: newStatus, mode, notes, date: new Date().toISOString() });
        } catch (e) { console.error("Error updating payment", e); }
      };

      const updateSettings = async (newSettings) => {
        if (!db || !user) return;
        try {
          const settingsRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'main');
          await setDoc(settingsRef, newSettings, { merge: true });
        } catch (e) { console.error("Error saving settings", e); }
      };

      const logAction = async (action, details) => {
        if (!db || !user) return;
        try {
          const logRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'logs'));
          await setDoc(logRef, { id: logRef.id, timestamp: new Date().toISOString(), action, details });
        } catch (e) { console.error("Error logging action", e); }
      };

      const runMonthlyReset = async (manual = false) => {
        if (!db || !user) { alert("Database required for Monthly Reset feature."); return 0; }
        const today = new Date();
        const currentMonth = today.getMonth() + 1;
        const currentYear = today.getFullYear();
        const resetKey = `${currentMonth}-${currentYear}`;

        if (manual || (today.getDate() >= 5 && settings.lastResetMonth !== resetKey)) {
          let resetCount = 0;
          const activePlayers = players.filter(p => p.status === 'ACTIVE');
          
          for (const player of activePlayers) {
            const hasRecord = payments.some(pay => pay.playerId === player.id && pay.month === currentMonth && pay.year === currentYear);
            if (!hasRecord) {
              const paymentRef = doc(collection(db, 'artifacts', appId, 'users', user.uid, 'payments'));
              await setDoc(paymentRef, {
                id: paymentRef.id, playerId: player.id, month: currentMonth, year: currentYear,
                expectedAmount: player.feeAmount, paidAmount: 0, status: 'UNPAID', mode: '', notes: '', date: null
              });
              resetCount++;
            }
          }
          await updateSettings({ ...settings, lastResetMonth: resetKey });
          await logAction('MONTHLY_RESET', `Reset triggered. ${resetCount} new unpaid records created.`);
          return resetCount;
        }
        return 0;
      };

      if (!isDataLoaded) {
        return (
          <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center text-slate-300">
            <Loader2 className="animate-spin mb-4 text-blue-500" size={48} />
            <h2 className="text-xl font-semibold">Connecting to Database...</h2>
          </div>
        );
      }

      return (
        <AppContext.Provider value={{ players, addPlayer, payments, markPayment, sports, batches, settings, updateSettings, logs, logAction, runMonthlyReset }}>
          {children}
        </AppContext.Provider>
      );
    };

    const useAppContext = () => useContext(AppContext);

    // --- UI Components ---
    const Card = ({ children, className = '' }) => (
      <div className={`bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5 ${className}`}>{children}</div>
    );

    const Badge = ({ status }) => {
      const styles = {
        PAID: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
        UNPAID: 'bg-rose-500/20 text-rose-400 border-rose-500/30',
        PARTIAL: 'bg-amber-500/20 text-amber-400 border-amber-500/30',
        ACTIVE: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
        INACTIVE: 'bg-slate-500/20 text-slate-400 border-slate-500/30',
      };
      return <span className={`px-2.5 py-1 text-xs font-semibold rounded-full border ${styles[status] || styles.INACTIVE}`}>{status}</span>;
    };

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
          <div className="bg-slate-800 rounded-2xl w-full max-w-lg shadow-2xl border border-slate-700 overflow-hidden flex flex-col max-h-[90vh]">
            <div className="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
              <h2 className="text-xl font-bold text-slate-100">{title}</h2>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition-colors"><X size={20} /></button>
            </div>
            <div className="p-4 overflow-y-auto">{children}</div>
          </div>
        </div>
      );
    };

    const Input = ({ label, ...props }) => (
      <div className="mb-4">
        <label className="block text-sm font-medium text-slate-300 mb-1">{label}</label>
        <input className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:border-blue-500 focus:outline-none" {...props} />
      </div>
    );

    const Select = ({ label, options, ...props }) => (
      <div className="mb-4">
        <label className="block text-sm font-medium text-slate-300 mb-1">{label}</label>
        <select className="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:border-blue-500 focus:outline-none" {...props}>
          {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
        </select>
      </div>
    );

    const Button = ({ children, variant = 'primary', className = '', ...props }) => {
      const variants = {
        primary: "bg-blue-600 hover:bg-blue-700 text-white shadow-lg shadow-blue-900/20",
        secondary: "bg-slate-700 hover:bg-slate-600 text-slate-100",
        success: "bg-emerald-600 hover:bg-emerald-700 text-white shadow-lg shadow-emerald-900/20",
        danger: "bg-rose-600 hover:bg-rose-700 text-white",
        outline: "bg-transparent border border-slate-600 text-slate-300 hover:bg-slate-800 hover:text-white"
      };
      return (
        <button className={`px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 ${variants[variant]} ${className}`} {...props}>
          {children}
        </button>
      );
    };

    // --- Views ---
    const Dashboard = () => {
      const { players, payments, runMonthlyReset, logs } = useAppContext();
      const current = getCurrentMonthYear();
      
      const activePlayers = players.filter(p => p.status === 'ACTIVE').length;
      const currentMonthPayments = payments.filter(p => p.month === current.month && p.year === current.year);
      
      const totalCollected = currentMonthPayments.reduce((sum, p) => sum + Number(p.paidAmount || 0), 0);
      const totalPending = currentMonthPayments
        .filter(p => p.status !== 'PAID')
        .reduce((sum, p) => sum + (Number(p.expectedAmount) - Number(p.paidAmount || 0)), 0);
      
      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-bold text-slate-100">Overview</h1>
              <p className="text-slate-400 text-sm">Status for {MONTH_NAMES[current.month-1]} {current.year}</p>
            </div>
            <Button variant="outline" onClick={() => runMonthlyReset(true)}><Calendar size={16} /> Run Monthly Reset</Button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <Card className="border-t-4 border-t-blue-500">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-blue-500/20 text-blue-400 rounded-lg"><Users size={24} /></div>
                <div>
                  <p className="text-slate-400 text-sm">Active Players</p>
                  <h3 className="text-2xl font-bold text-slate-100">{activePlayers}</h3>
                </div>
              </div>
            </Card>
            <Card className="border-t-4 border-t-emerald-500">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-lg"><CheckCircle size={24} /></div>
                <div>
                  <p className="text-slate-400 text-sm">Collected</p>
                  <h3 className="text-2xl font-bold text-slate-100">₹{totalCollected.toLocaleString()}</h3>
                </div>
              </div>
            </Card>
            <Card className="border-t-4 border-t-rose-500">
              <div className="flex items-center gap-4">
                <div className="p-3 bg-rose-500/20 text-rose-400 rounded-lg"><AlertCircle size={24} /></div>
                <div>
                  <p className="text-slate-400 text-sm">Pending Fees</p>
                  <h3 className="text-2xl font-bold text-slate-100">₹{totalPending.toLocaleString()}</h3>
                </div>
              </div>
            </Card>
          </div>
        </div>
      );
    };

    const PlayersView = () => {
      const { players, sports, batches, addPlayer } = useAppContext();
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [formData, setFormData] = useState({ name: '', guardian: '', phone: '', sport: 'Badminton', batch: batches[0], feeAmount: '' });

      const handleSubmit = (e) => {
        e.preventDefault();
        addPlayer(formData);
        setIsAddModalOpen(false);
        setFormData({ name: '', guardian: '', phone: '', sport: 'Badminton', batch: batches[0], feeAmount: '' });
      };

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h1 className="text-2xl font-bold text-slate-100">Badminton Roster</h1>
            <Button onClick={() => setIsAddModalOpen(true)}><Plus size={18} /> New Admission</Button>
          </div>

          <Card className="p-0 overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-900/50 text-slate-400 text-sm uppercase">
                  <th className="p-4">Player</th>
                  <th className="p-4">Batch</th>
                  <th className="p-4">Contact</th>
                  <th className="p-4">Fee</th>
                  <th className="p-4 text-right">Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700/50">
                {players.length === 0 ? <tr><td colSpan="5" className="p-8 text-center text-slate-500">No players found.</td></tr> :
                  players.map(player => (
                    <tr key={player.id} className="hover:bg-slate-700/20">
                      <td className="p-4 font-medium text-slate-200">{player.name}</td>
                      <td className="p-4 text-slate-300 text-sm">{player.batch}</td>
                      <td className="p-4 text-slate-300 text-sm">{player.phone}</td>
                      <td className="p-4 text-slate-300 font-medium">₹{player.feeAmount}</td>
                      <td className="p-4 text-right"><Badge status={player.status} /></td>
                    </tr>
                  ))
                }
              </tbody>
            </table>
          </Card>

          <Modal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} title="New Admission (Badminton)">
            <form onSubmit={handleSubmit}>
              <Input label="Full Name" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} />
              <Input label="Phone Number" required type="tel" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} />
              <Select label="Batch" required options={batches} value={formData.batch} onChange={e => setFormData({...formData, batch: e.target.value})} />
              <Input label="Monthly Fee (₹)" required type="number" min="0" value={formData.feeAmount} onChange={e => setFormData({...formData, feeAmount: e.target.value})} />
              <div className="mt-6 flex justify-end gap-3 pt-4 border-t border-slate-700">
                <Button type="submit">Save Admission</Button>
              </div>
            </form>
          </Modal>
        </div>
      );
    };

    const FeesView = () => {
      const { players, payments, markPayment, settings, logAction } = useAppContext();
      const current = getCurrentMonthYear();
      const [isPayModalOpen, setIsPayModalOpen] = useState(false);
      const [currentPaymentRec, setCurrentPaymentRec] = useState(null);
      const [payFormData, setPayFormData] = useState({ amount: '', mode: 'Cash' });

      const feeRecords = players.filter(p => p.status === 'ACTIVE').map(player => {
        const payment = payments.find(pay => pay.playerId === player.id && pay.month === current.month && pay.year === current.year) || {
          id: null, status: 'UNPAID', expectedAmount: player.feeAmount, paidAmount: 0
        };
        return { ...player, payment };
      });

      const handleProcessPayment = (e) => {
        e.preventDefault();
        if(currentPaymentRec?.payment.id) {
           markPayment(currentPaymentRec.payment.id, payFormData.mode, payFormData.amount, '');
           logAction('PAYMENT_RECEIVED', `₹${payFormData.amount} received from ${currentPaymentRec.name}.`);
        }
        setIsPayModalOpen(false);
      };

      const handleSendReminder = (record) => {
        let message = settings.whatsappTemplate
          .replace('{Player_Name}', record.name)
          .replace('{Amount}', record.payment.expectedAmount - record.payment.paidAmount)
          .replace('{Month}', MONTH_NAMES[current.month-1])
          .replace('{Status}', record.payment.status.toLowerCase());
        logAction('WHATSAPP_REMINDER', `Reminder sent to ${record.name}.`);
        window.open(`https://wa.me/91${record.phone.replace(/\D/g,'')}?text=${encodeURIComponent(message)}`, '_blank');
      };

      return (
        <div className="space-y-6">
          <h1 className="text-2xl font-bold text-slate-100">Fee Collection</h1>
          <Card className="p-0 overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-900/50 text-slate-400 text-sm uppercase">
                  <th className="p-4">Player</th>
                  <th className="p-4">Amount Due</th>
                  <th className="p-4">Status</th>
                  <th className="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-700/50">
                {feeRecords.map(record => (
                  <tr key={record.id} className="hover:bg-slate-700/20">
                    <td className="p-4 font-medium text-slate-200">{record.name}</td>
                    <td className="p-4 text-slate-300 font-medium">₹{record.payment.expectedAmount}</td>
                    <td className="p-4"><Badge status={record.payment.status} /></td>
                    <td className="p-4 text-right flex justify-end gap-2">
                      {record.payment.status !== 'PAID' ? (
                        <>
                          <Button variant="outline" className="px-2 py-1 text-xs" onClick={() => handleSendReminder(record)}><MessageCircle size={14} className="text-emerald-500" /></Button>
                          <Button variant="success" className="px-3 py-1 text-xs" onClick={() => { setCurrentPaymentRec(record); setPayFormData({ amount: record.payment.expectedAmount, mode: 'Cash'}); setIsPayModalOpen(true); }}>Mark Paid</Button>
                        </>
                      ) : <span className="text-slate-500 text-sm flex items-center gap-1"><CheckCircle size={14}/> Settled</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
          <Modal isOpen={isPayModalOpen} onClose={() => setIsPayModalOpen(false)} title={`Payment: ${currentPaymentRec?.name}`}>
            <form onSubmit={handleProcessPayment}>
              <Input label="Amount Received (₹)" required type="number" value={payFormData.amount} onChange={e => setPayFormData({...payFormData, amount: e.target.value})} />
              <Select label="Payment Mode" required options={['Cash', 'UPI']} value={payFormData.mode} onChange={e => setPayFormData({...payFormData, mode: e.target.value})} />
              <div className="mt-6 flex justify-end pt-4 border-t border-slate-700"><Button type="submit" variant="success">Confirm Payment</Button></div>
            </form>
          </Modal>
        </div>
      );
    };

    const AppContent = () => {
      const [currentView, setCurrentView] = useState('dashboard');
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: LayoutDashboard },
        { id: 'players', label: 'Admissions', icon: Users },
        { id: 'fees', label: 'Fees Collection', icon: CreditCard }
      ];

      return (
        <div className="min-h-screen bg-slate-900 text-slate-200 font-sans flex flex-col md:flex-row">
          <aside className="w-full md:w-64 bg-slate-800 border-r border-slate-700 flex flex-col p-4 md:p-0">
            <div className="p-6 hidden md:flex items-center gap-3">
               <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">B</div>
               <div className="font-bold text-xl text-white tracking-tight">Badminton<span className="text-blue-500">Pro</span></div>
            </div>
            <nav className="flex-1 px-4 py-2 space-y-1.5 flex flex-row md:flex-col overflow-x-auto md:overflow-visible">
              {navItems.map(item => {
                const Icon = item.icon;
                const isActive = currentView === item.id;
                return (
                  <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all whitespace-nowrap ${isActive ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-700/50 hover:text-slate-200'}`}>
                    <Icon size={20} className={isActive ? 'text-white' : ''} /> <span className="font-medium">{item.label}</span>
                  </button>
                )
              })}
            </nav>
          </aside>
          <main className="flex-1 p-4 md:p-8 overflow-y-auto bg-[#0F172A]">
            {currentView === 'dashboard' && <Dashboard />}
            {currentView === 'players' && <PlayersView />}
            {currentView === 'fees' && <FeesView />}
          </main>
